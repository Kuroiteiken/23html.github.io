name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    # Markdown never reaches the deployed site: scripts/build-site.js copies
    # index.html, the three root assets, and the changelog/css/icons/locales
    # directories, none of which contain a .md file. A documentation-only push
    # would therefore rebuild and redeploy a byte-identical dist/. Both spellings
    # are listed because path filters are case-sensitive and docs/ still holds two
    # files ending in .MD.
    paths-ignore:
      - "**.md"
      - "**.MD"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole job is a one-second build, a twelve-second check and a headless
    # Chrome run. A ceiling well above that still ends a hung browser in minutes
    # rather than letting the default six-hour limit burn a runner.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Nothing here pushes back to the repository; the deploy goes out as a
          # Pages artifact. Leaving the token in .git/config would only widen what
          # a compromised build step could reach.
          persist-credentials: false

      - name: Set up Node.js
        # v7 is the current major. Its only change from v6 is an internal move to ESM, so
        # node-version and cache behave identically -- checked against the v7 README rather
        # than assumed, because the other five actions here are already on their latest major
        # and this one being a version behind was an oversight rather than a decision.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game and Pages site
        run: npm run build

      - name: Validate generated files
        run: npm run check

      - name: Test in headless Chrome
        run: npm run test:browser

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
